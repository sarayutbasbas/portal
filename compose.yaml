services:
  portal:
    build: .
    container_name: basnana-portal
    restart: always
    ports:
      - "2022:2022"
    depends_on:
      status:
        condition: service_healthy

  status:
    build:
      context: .
      dockerfile: Dockerfile.status
    container_name: basnana-portal-status
    restart: always

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: basnana-cloudflared
    restart: always
    depends_on:
      portal:
        condition: service_healthy
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - ${CLOUDFLARE_TUNNEL_TOKEN:-SET_TOKEN_IN_DOT_ENV}
